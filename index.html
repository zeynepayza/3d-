<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trilocale · 3D Tur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="markers"></div>

    <div id="loader">
      <div class="loader-inner">
        <p class="kicker">Model yükleniyor</p>
        <div class="bar"><span id="bar-fill"></span></div>
        <p id="loader-pct">0%</p>
      </div>
    </div>

    <header class="topbar">
      <span class="brand">Trilocale<em>3D</em></span>
      <div class="progress"><span id="progress-fill"></span></div>
    </header>

    <main id="sections"></main>

    <aside id="items">
      <p class="kicker">Eşyalar</p>
      <ul id="item-list"></ul>
    </aside>

    <div id="focus-card" hidden>
      <p class="kicker" id="focus-kicker"></p>
      <h2 id="focus-title"></h2>
      <p id="focus-text"></p>
      <p class="hint">Sürükleyerek döndürün, tekerlekle yakınlaştırın.</p>
      <button id="focus-back">← Tura dön <kbd>Esc</kbd></button>
    </div>

    <footer class="credit">
      Model: “Trilocale Via Boncompagni Milano”, Fabio Siccardi,
      <a href="https://sketchfab.com/3d-models/trilocale-via-boncompagni-milano-dd261cf6c2e647cab915f015230bb15e" target="_blank" rel="noopener">Sketchfab</a>
      · CC BY 4.0
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
